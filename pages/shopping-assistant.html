<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Assistant — Back-office</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    /* ── Page header ── */
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-5); margin-bottom:var(--sp-6); }
    .page-head-title { font-size:var(--text-4xl); font-weight:var(--weight-semibold); color:var(--text-primary); letter-spacing:-.02em; margin-bottom:var(--sp-1); }
    .page-head-subtitle { font-size:var(--text-sm); color:var(--text-secondary); max-width:600px; line-height:1.55; }
    .page-head-subtitle a { color:var(--color-info-text); text-decoration:underline; cursor:pointer; }
    .btn-create { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 var(--sp-4); border-radius:var(--r-full); background:var(--surface); border:1px solid var(--border); font-family:var(--font); font-size:var(--text-sm); font-weight:var(--weight-medium); color:var(--text-primary); cursor:pointer; transition:background var(--t-fast); white-space:nowrap; flex-shrink:0; margin-top:4px; }
    .btn-create:hover { background:var(--hover); }

    /* ── Assistant list ── */
    .assistant-list { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl); overflow:hidden; }
    .assistant-row { display:flex; align-items:center; gap:var(--sp-4); padding:var(--sp-4) var(--sp-5); border-bottom:1px solid var(--border); transition:background var(--t-fast); cursor:pointer; }
    .assistant-row:last-child { border-bottom:none; }
    .assistant-row:hover { background:var(--hover); }
    .assistant-name { font-size:var(--text-md); font-weight:var(--weight-semibold); color:var(--text-primary); min-width:180px; }
    .assistant-meta { font-size:var(--text-sm); color:var(--text-secondary); flex:1; }
    .assistant-lang { font-size:var(--text-sm); color:var(--text-secondary); min-width:80px; }

    /* ── Toggle switch ── */
    .toggle-switch { display:inline-flex; align-items:center; gap:var(--sp-2); cursor:pointer; flex-shrink:0; }
    .toggle-switch input { display:none; }
    .toggle-track { width:36px; height:20px; border-radius:10px; background:var(--border); position:relative; transition:background var(--t-base); flex-shrink:0; }
    .toggle-switch input:checked + .toggle-track { background:var(--brand-green); }
    .toggle-track::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform var(--t-base); box-shadow:0 1px 2px rgba(0,0,0,.15); }
    .toggle-switch input:checked + .toggle-track::after { transform:translateX(16px); }
    .toggle-status { font-size:var(--text-sm); color:var(--text-secondary); min-width:50px; }

    /* ── Row actions ── */
    .assistant-actions { display:flex; align-items:center; gap:var(--sp-1); flex-shrink:0; }
    .icon-btn { width:30px; height:30px; border-radius:var(--r-md); background:transparent; border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:var(--text-secondary); transition:all var(--t-fast); }
    .icon-btn:hover { background:var(--hover); color:var(--text-primary); }
    .icon-btn-danger:hover { background:var(--color-danger-bg); color:var(--color-danger-text); }
  </style>
</head>
<body>

  <script src="../js/nav.js"></script>

  <main class="layout-default">
    <div class="page-content">

      <!-- Page header -->
      <div class="page-head">
        <div>
          <h1 class="page-head-title">Shopping Assistant</h1>
          <p class="page-head-subtitle">The Shopping Assistant autonomously guides shoppers during their online purchase journey. <a>Learn more about Shopping Assistant →</a></p>
        </div>
        <button class="btn-create" onclick="window.location.href='./shopping-assistant-builder.html'">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Create
        </button>
      </div>

      <!-- Assistant list -->
      <div class="assistant-list">
        <div class="assistant-row" onclick="window.location.href='./shopping-assistant-builder.html'">
          <span class="assistant-name">My first Assistant</span>
          <span class="assistant-meta">Created 17 days ago</span>
          <span class="assistant-lang">English</span>
          <label class="toggle-switch" onclick="event.stopPropagation()">
            <input type="checkbox" checked onchange="this.closest('.assistant-row').querySelector('.toggle-status').textContent = this.checked ? 'Active' : 'Inactive'">
            <span class="toggle-track"></span>
          </label>
          <span class="toggle-status">Active</span>
          <div class="assistant-actions">
            <button class="icon-btn" title="Edit" onclick="event.stopPropagation(); window.location.href='./shopping-assistant-builder.html'">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 2.5l2.5 2.5L5 13.5H2.5V11L11 2.5z"/>
              </svg>
            </button>
            <button class="icon-btn" title="Duplicate" onclick="event.stopPropagation()">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="5" width="8" height="9" rx="1.5"/>
                <path d="M3 11V3a1.5 1.5 0 011.5-1.5H11"/>
              </svg>
            </button>
            <button class="icon-btn icon-btn-danger" title="Delete" onclick="event.stopPropagation()">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2.5 4.5h11M6 4.5V3a.5.5 0 01.5-.5h3a.5.5 0 01.5.5v1.5M7 7.5v4M9 7.5v4M3.5 4.5l.9 8.1a.5.5 0 00.5.4h6.2a.5.5 0 00.5-.4l.9-8.1"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="../js/interactions.js"></script>
</body>
</html>
